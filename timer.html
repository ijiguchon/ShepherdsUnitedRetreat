<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>2026 서북미 목자연합수련회 · 실시간 진행 안내</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

  :root{
    --bg-a:#eaf6ff; --bg-b:#cfeaff; --bg-c:#a8d8f0;
    --accent:#2f7fb8; --accent-l:#5aa8d8;
    --ink:#1c3a4a; --muted:#5c7a8a;
    --card:rgba(255,255,255,0.72);
    --line:rgba(47,127,184,0.22);
    --sun:#fff2c0; --mtn:#7fa8c9; --mtn2:#a9c6de; --tree:#4f8f6a; --water:#bfe3ea;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    overflow:hidden;
    transition: background 2.2s ease;
  }

  #scene{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* ===== 10초 전 화면 전체 확대 효과 ===== */
  #zoomOverlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0);
    pointer-events:none;
    opacity:0;
  }
  #zoomOverlay.fire{
    animation: zoomFlash 1.4s cubic-bezier(.2,.8,.3,1) forwards;
  }
  #zoomNumber{
    font-family:'JetBrains Mono',monospace; font-weight:800;
    color:#ff4d4d;
    text-shadow:0 0 40px rgba(255,77,77,0.8);
    transform:scale(0.3);
    font-size:18vw;
  }
  @keyframes zoomFlash{
    0%   { opacity:0; background:rgba(0,0,0,0); }
    12%  { opacity:1; background:rgba(0,0,0,0.55); }
    55%  { opacity:1; background:rgba(0,0,0,0.55); }
    100% { opacity:0; background:rgba(0,0,0,0); }
  }
  #zoomOverlay.fire #zoomNumber{
    animation: zoomNumberPulse 1.4s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes zoomNumberPulse{
    0%   { transform:scale(0.3); }
    30%  { transform:scale(1.15); }
    45%  { transform:scale(1); }
    80%  { transform:scale(1); }
    100% { transform:scale(0.6); }
  }

  #scene svg{ position:absolute; bottom:0; width:100%; height:46%; }
  #scene .sun{ fill:var(--sun); transition:fill 2.2s ease, cy 2.2s ease; }
  #scene .cloud{ fill:#ffffff; opacity:.85; }
  #scene .mtn-back{ fill:var(--mtn2); transition:fill 2.2s ease; }
  #scene .mtn-front{ fill:var(--mtn); transition:fill 2.2s ease; }
  #scene .tree{ fill:var(--tree); transition:fill 2.2s ease; }
  #scene .water{ fill:var(--water); transition:fill 2.2s ease; }
  #scene .water-line{ stroke:#ffffff; opacity:.5; }
  #scene .stream{ stroke:var(--water); transition:stroke 2.2s ease; }
  #scene .birds{ stroke:var(--ink); opacity:.55; transition:stroke 2.2s ease; }
  #scene .fish{ fill:var(--accent); opacity:.6; transition:fill 2.2s ease; }

  #app{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: auto 1fr;
    height:100vh;
    padding:26px 30px;
    gap:18px;
  }

  header{
    grid-column:1/3;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .cross{ width:18px;height:18px;position:relative;flex-shrink:0; }
  .brand .cross::before, .brand .cross::after{ content:''; position:absolute; background:var(--accent); border-radius:2px; transition:background 2.2s ease;}
  .brand .cross::before{ left:7px; top:0; width:4px; height:18px; }
  .brand .cross::after{ left:1px; top:4px; width:16px; height:4px; }
  .brand-text .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em;
    color:var(--accent); text-transform:uppercase; transition:color 2.2s ease;
  }
  .brand-text h1{
    margin:2px 0 0; font-family:'Noto Serif KR',serif; font-weight:900;
    font-size:21px; color:var(--ink);
  }
  .clock-wrap{
    text-align:right;
    opacity:0.5; /* 평소엔 조용하게, 항상 떠있음 (마우스 무관) */
    transition:opacity .5s ease;
  }
  .clock-wrap:hover{ opacity:0.9; }
  #headerTimer .countdown{
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:20px;
    letter-spacing:0.02em; color:var(--muted); line-height:1;
    transition:color .5s ease, font-size .5s ease;
  }
  #headerTimer.alert{ opacity:1; }
  #headerTimer.alert .countdown{ color:#c0392b; font-size:38px; }
  #headerTimer .countdown-label{
    font-size:9.5px; color:var(--muted); margin-top:3px; letter-spacing:.04em;
  }
  #headerTimer.alert .countdown-label{ color:#c0392b; font-size:11px; }

  /* ===== 하단 자동숨김 툴바 ===== */
  .toolbar{
    position:fixed; left:50%; bottom:14px; transform:translate(-50%, 0);
    z-index:20;
    display:flex; align-items:center; gap:6px;
    background:rgba(20,20,20,0.55); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.18); border-radius:999px;
    padding:7px 12px;
    font-family:'JetBrains Mono',monospace;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease, transform .3s ease;
  }
  .toolbar.show{ opacity:1; pointer-events:auto; }
  .toolbar:hover{ opacity:1; pointer-events:auto; }

  .tb-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    color:#f0f0f0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    border-radius:999px; padding:6px 11px; cursor:pointer; transition:all .2s ease;
    white-space:nowrap; line-height:1;
  }
  .tb-btn:hover{ background:rgba(255,255,255,0.25); }
  .tb-mode{ min-width:64px; }
  .tb-start{ background:rgba(80,200,120,0.35); border-color:rgba(80,200,120,0.5); }
  .tb-start:hover{ background:rgba(80,200,120,0.55); }
  .tb-group{ display:flex; align-items:center; gap:6px; }
  .tb-sep{ width:1px; height:16px; background:rgba(255,255,255,0.2); margin:0 2px; }
  .tb-label{ font-size:10.5px; color:rgba(255,255,255,0.6); min-width:32px; text-align:center; }

  main{ display:flex; flex-direction:column; gap:16px; min-height:0; }

  .now-card{
    position:relative; flex:1;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.6);
    background:var(--card);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(30,60,80,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
    padding:32px 38px;
    display:flex; flex-direction:column; justify-content:center;
    transition:box-shadow .6s ease, border-color .6s ease, background 2.2s ease;
    overflow:hidden;
  }
  .now-card.alert{
    border-color:rgba(220,80,70,0.55);
    box-shadow:0 18px 50px rgba(200,60,50,0.22), inset 0 1px 0 rgba(255,255,255,0.8);
    animation:pulseAlert 1.8s ease-in-out infinite;
  }
  @keyframes pulseAlert{
    0%,100%{ box-shadow:0 18px 50px rgba(200,60,50,0.18), inset 0 1px 0 rgba(255,255,255,0.8); }
    50%{ box-shadow:0 18px 60px rgba(200,60,50,0.35), inset 0 1px 0 rgba(255,255,255,0.8); }
  }

  .now-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.18em;
    color:var(--accent); text-transform:uppercase; margin-bottom:8px; transition:color 2.2s ease;
  }
  .now-card.alert .now-eyebrow{ color:#c0392b; }

  .now-title{
    font-family:'Noto Serif KR',serif; font-weight:900; font-size:clamp(26px,3.8vw,46px);
    line-height:1.18; color:var(--ink); margin:0 0 8px;
  }
  .now-leader{ font-size:16px; color:var(--muted); margin-bottom:16px; }
  .now-leader b{ color:var(--accent); font-weight:700; transition:color 2.2s ease;}

  .now-desc{
    font-size:15px; line-height:1.65; color:var(--ink);
    max-width:640px; margin:0 0 22px;
    padding:14px 18px; border-radius:14px;
    background:rgba(255,255,255,0.55); border:1px solid var(--line);
    display:none;
  }
  .now-desc.show{ display:block; }
  .now-desc b{ color:var(--accent); }

  .now-video{ display:none; margin:0 0 22px; max-width:480px; }
  .now-video.show{ display:block; }
  .now-video-inner{
    position:relative; padding-bottom:56.25%; height:0; overflow:hidden;
    border-radius:14px; border:1px solid var(--line); box-shadow:0 8px 24px rgba(30,60,80,0.12);
  }
  .now-video-inner iframe{ position:absolute; top:0; left:0; width:100%; height:100%; }
  .now-video-inner video{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .now-video-caption{ font-size:12.5px; color:var(--muted); margin-top:8px; text-align:center; }

  .countdown-row{ display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; }

  .range-pill{
    margin-left:auto; align-self:flex-start;
    font-family:'JetBrains Mono',monospace; font-size:13px;
    color:var(--muted); border:1px solid var(--line); border-radius:999px;
    padding:7px 15px; background:rgba(255,255,255,0.5);
  }

  .next-strip{
    border-radius:16px; border:1px solid rgba(255,255,255,0.6);
    background:var(--card); backdrop-filter:blur(10px);
    padding:14px 20px; display:flex; align-items:center; gap:14px;
    box-shadow:0 8px 24px rgba(30,60,80,0.08);
  }
  .next-strip .tag{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.15em;
    color:var(--muted); text-transform:uppercase; border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; flex-shrink:0;
  }
  .next-strip .txt{ font-size:14.5px; color:var(--ink); }
  .next-strip .txt b{ color:var(--accent); transition:color 2.2s ease;}
  .next-strip .time{ margin-left:auto; font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:12.5px; }

  aside{
    border-left:1px solid var(--line);
    padding-left:20px; overflow-y:auto; display:flex; flex-direction:column;
  }
  aside h2{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.16em;
    color:var(--muted); text-transform:uppercase; margin:0 0 12px;
  }
  .rail{ position:relative; padding-left:20px; }
  .rail::before{
    content:''; position:absolute; left:5px; top:6px; bottom:6px; width:1px;
    background:var(--line);
  }
  .item{ position:relative; padding:0 0 18px; }
  .item:last-child{ padding-bottom:0; }
  .item::before{
    content:''; position:absolute; left:-20px; top:3px; width:10px; height:10px;
    border-radius:50%; background:#fff; border:2px solid var(--muted);
    transition:all .4s ease;
  }
  .item .t{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); }
  .item .n{ font-size:13px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .item.done::before{ background:var(--accent); border-color:var(--accent); }
  .item.done .t, .item.done .n{ color:rgba(92,122,138,0.5); text-decoration:line-through rgba(92,122,138,0.35); }
  .item.active::before{
    background:var(--accent); border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(47,127,184,0.2);
    width:12px; height:12px; left:-21px; top:2px;
  }
  .item.active .t{ color:var(--accent); font-weight:700; }
  .item.active .n{ color:var(--ink); font-weight:700; }
  .item.alert::before{ background:#c0392b; border-color:#c0392b; box-shadow:0 0 0 4px rgba(192,57,43,0.22); }
  .item.alert .t{ color:#c0392b; }

  footer{
    grid-column:1/3; text-align:center; font-size:10.5px; color:var(--muted);
    padding-top:8px; border-top:1px solid var(--line); letter-spacing:.05em;
  }

  @media (max-width:900px){
    #app{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr; }
    aside{ border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:14px; max-height:200px;}
  }
</style>
</head>
<body>

<div id="scene">
  <svg viewBox="0 0 1200 400" preserveAspectRatio="none">
    <circle class="sun" cx="980" cy="90" r="70"/>
    <ellipse class="cloud" cx="180" cy="70" rx="70" ry="22"/>
    <ellipse class="cloud" cx="240" cy="60" rx="50" ry="18"/>
    <ellipse class="cloud" cx="520" cy="40" rx="60" ry="18"/>
    <ellipse class="cloud" cx="820" cy="55" rx="45" ry="15"/>

    <!-- 새 (하늘, 시간대 상관없이 은은하게) -->
    <g class="birds">
      <path d="M120,130 q10,-12 20,0 q10,-12 20,0" fill="none" stroke-width="2.4"/>
      <path d="M700,60 q8,-10 16,0 q8,-10 16,0" fill="none" stroke-width="2"/>
      <path d="M760,90 q7,-9 14,0 q7,-9 14,0" fill="none" stroke-width="2"/>
      <path d="M420,50 q6,-8 12,0 q6,-8 12,0" fill="none" stroke-width="1.8"/>
    </g>

    <polygon class="mtn-back" points="0,260 150,120 300,260"/>
    <polygon class="mtn-back" points="220,260 400,90 600,260"/>
    <polygon class="mtn-back" points="520,260 700,140 880,260"/>

    <polygon class="mtn-front" points="-50,300 200,160 480,300"/>
    <polygon class="mtn-front" points="380,300 650,150 1000,300"/>
    <polygon class="mtn-front" points="850,300 1080,180 1260,300"/>

    <!-- 숲 (양쪽으로 더 풍성하게) -->
    <g class="tree">
      <polygon points="60,300 78,250 96,300"/>
      <polygon points="80,300 100,235 120,300"/>
      <polygon points="90,275 100,225 110,275"/>
      <polygon points="120,300 138,255 156,300"/>
      <polygon points="150,300 168,245 186,300"/>
      <polygon points="180,300 196,260 212,300"/>

      <polygon points="988,300 1004,260 1020,300"/>
      <polygon points="1015,300 1033,250 1051,300"/>
      <polygon points="1050,300 1070,235 1090,300"/>
      <polygon points="1060,275 1080,225 1100,275"/>
      <polygon points="1095,300 1113,255 1131,300"/>
      <polygon points="1128,300 1144,260 1160,300"/>
    </g>

    <!-- 시냇물 (숲 사이로 굽이쳐 흘러 강물/바다로 이어짐) -->
    <path class="stream" d="M600,180 C620,220 580,250 610,290 C630,315 590,330 600,340"
          fill="none" stroke-width="10" opacity=".55" stroke-linecap="round"/>

    <!-- 강물/바다 -->
    <path class="water" d="M0,340 Q150,320 300,340 T600,340 T900,340 T1200,340 L1200,400 L0,400 Z"/>
    <path class="water-line" d="M0,355 Q150,340 300,355 T600,355 T900,355 T1200,355" fill="none" stroke-width="2"/>
    <path class="water-line" d="M0,372 Q150,362 300,372 T600,372 T900,372 T1200,372" fill="none" stroke-width="1.4" opacity=".6"/>

    <!-- 물고기 (강물/바다 속) -->
    <g class="fish">
      <path d="M260,378 q14,-9 26,0 q-4,7 -13,7 t-13,-7 Z M286,378 l8,-5 l0,10 Z"/>
      <path d="M470,368 q12,-8 22,0 q-3,6 -11,6 t-11,-6 Z M492,368 l7,-4 l0,8 Z"/>
      <path d="M860,376 q13,-8 24,0 q-3,6 -12,6 t-12,-6 Z M884,376 l7,-4 l0,8 Z"/>
    </g>
  </svg>
</div>

<div id="zoomOverlay">
  <div id="zoomNumber">10</div>
</div>

<div id="app">
  <header>
    <a href="https://ijiguchon.github.io/ShepherdsUnitedRetreat/" class="brand" style="text-decoration:none; color:inherit;">
      <div class="cross"></div>
      <div class="brand-text">
        <div class="eyebrow">← 메인 사이트로 · Shepherds United Retreat</div>
        <h1>2026 서북미 목자연합수련회</h1>
      </div>
    </a>
    <div class="clock-wrap" id="headerTimer">
      <div class="countdown" id="countdown">--:--</div>
      <div class="countdown-label" id="countdownLabel">종료까지 남은 시간</div>
    </div>
  </header>

  <main>
    <div class="now-card" id="nowCard">
      <div class="now-eyebrow" id="nowEyebrow">진행 중</div>
      <div class="now-title" id="nowTitle">행사 시작 전</div>
      <div class="now-leader" id="nowLeader">&nbsp;</div>
      <div class="now-desc" id="nowDesc"></div>
      <div class="now-video" id="nowVideo">
        <div class="now-video-inner">
          <iframe id="videoFrame" src="" frameborder="0" referrerpolicy="strict-origin-when-cross-origin"
            allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="now-video-caption">🎵 그 날에 (One Day) — 합창 · Matt Redman</div>
      </div>
      <div class="now-video" id="openingVideoWrap">
        <div class="now-video-inner">
          <iframe id="openingVideo" src="" frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="now-video-caption">🎬 2026 목자연합수련회 초청영상</div>
      </div>
      <div class="countdown-row">
        <div class="range-pill" id="rangePill">--:-- – --:--</div>
      </div>
    </div>

    <div class="next-strip">
      <div class="tag">Next</div>
      <div class="txt" id="nextTxt">다음 순서를 불러오는 중…</div>
      <div class="time" id="nextTime"></div>
    </div>
  </main>

  <aside>
    <h2>전체 일정</h2>
    <div class="rail" id="rail"></div>
  </aside>

  <footer></footer>
</div>

<!-- ===== 하단 자동숨김 툴바 ===== -->
<div id="toolbar" class="toolbar">
  <button id="fsBtn" class="tb-btn">⛶</button>
  <span class="tb-sep"></span>
  <button id="modeBtn" class="tb-btn tb-mode">🔴 AUTO</button>
  <span id="navGroup" class="tb-group" style="display:none;">
    <button id="firstBtn" class="tb-btn">⏮ FIRST</button>
    <button id="prevBtn" class="tb-btn">◀</button>
    <span id="manualLabel" class="tb-label">-</span>
    <button id="nextBtn" class="tb-btn">▶</button>
    <button id="lastBtn" class="tb-btn">LAST ⏭</button>
    <span class="tb-sep"></span>
    <button id="startBtn" class="tb-btn tb-start">⏱ START</button>
    <button id="pauseBtn" class="tb-btn" style="display:none;">⏸ PAUSE</button>
    <button id="resumeBtn" class="tb-btn tb-start" style="display:none;">▶ RESUME</button>
    <button id="stopBtn" class="tb-btn" style="display:none;">⏹ STOP</button>
  </span>
  <span class="tb-sep"></span>
  <button id="zoomOutBtn" class="tb-btn">－</button>
  <span id="zoomLabel" class="tb-label">100%</span>
  <button id="zoomInBtn" class="tb-btn">＋</button>
  <button id="zoomResetBtn" class="tb-btn">⤾</button>
</div>

<script>

const SCENES = {
  dawn:   { a:'#fff6e9', b:'#ffe3c2', c:'#ffd9a8', accent:'#e8935a', accentL:'#f0a878', ink:'#4a3728', muted:'#8a6f57', sun:'#fff2c0', mtn:'#e0b48f', mtn2:'#f0d3ba', tree:'#c98a52', water:'#ffe9d2' },
  sky:    { a:'#eaf6ff', b:'#cfeaff', c:'#a8d8f0', accent:'#2f7fb8', accentL:'#5aa8d8', ink:'#1c3a4a', muted:'#5c7a8a', sun:'#fff2c0', mtn:'#7fa8c9', mtn2:'#a9c6de', tree:'#4f8f6a', water:'#bfe3ea' },
  forest: { a:'#f3faf0', b:'#d9f0d3', c:'#b8e0b0', accent:'#3f8f5c', accentL:'#6ab588', ink:'#234d30', muted:'#5a7d63', sun:'#fff6c8', mtn:'#8fbf9a', mtn2:'#b8d9bd', tree:'#3f8f5c', water:'#cdeaf0' },

const WARN_MIN = 5;
let lastZoomKey = null;
function fireZoomEffect(displayText){
  const el = document.getElementById('zoomOverlay');
  const numEl = document.getElementById('zoomNumber');
  numEl.textContent = displayText;
  el.classList.remove('fire');
  void el.offsetWidth; // 리플로우로 애니메이션 재시작 가능하게
  el.classList.add('fire');
  setTimeout(() => el.classList.remove('fire'), 1450);
}
function maybeTriggerZoom(remainSec, key, displayText){
  if (remainSec <= 10 && remainSec > 0) {
    if (lastZoomKey !== key) {
      lastZoomKey = key;
      fireZoomEffect(displayText);
    }
  }
}

function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
SCHEDULE.forEach(it=>{ it.sMin=toMinutes(it.s); it.eMin=toMinutes(it.e); });
function pad(n){ return String(n).padStart(2,'0'); }
function fmt12(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const ap = h < 12 ? 'AM' : 'PM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12+':'+pad(m)+' '+ap;
}

let currentScene = null;
function applyScene(key){
  if(key === currentScene) return;
  currentScene = key;
  const p = SCENES[key] || SCENES.sky;
  const r = document.documentElement.style;
  r.setProperty('--bg-a', p.a); r.setProperty('--bg-b', p.b); r.setProperty('--bg-c', p.c);
  r.setProperty('--accent', p.accent); r.setProperty('--accent-l', p.accentL);
  r.setProperty('--ink', p.ink); r.setProperty('--muted', p.muted);
  r.setProperty('--sun', p.sun); r.setProperty('--mtn', p.mtn); r.setProperty('--mtn2', p.mtn2);
  r.setProperty('--tree', p.tree); r.setProperty('--water', p.water);
  const sunY = (key==='dawn' || key==='sunset' || key==='golden') ? 170 : 90;
  document.querySelector('#scene .sun').setAttribute('cy', sunY);

  // 장면별로 시냇물·물고기·새의 존재감을 다르게 (자연 요소 다변화)
  const streamEl = document.querySelector('#scene .stream');
  const fishEl = document.querySelector('#scene .fish');
  const birdsEl = document.querySelector('#scene .birds');
  const streamProminent = (key==='forest' || key==='sky');
  streamEl.style.opacity = streamProminent ? '0.75' : '0.35';
  fishEl.style.opacity = streamProminent ? '0.7' : '0.3';
  birdsEl.style.opacity = (key==='sunset' || key==='golden' || key==='sky') ? '0.6' : '0.3';
}

function render(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  let manualAlertGlobal = false;

  let current=null, currentIdx=-1, next=null;

  if (isManual) {
    currentIdx = manualIndex;
    current = SCHEDULE[manualIndex];
    next = SCHEDULE[manualIndex+1] || null;
  } else {
    for(let i=0;i<SCHEDULE.length;i++){
      const it = SCHEDULE[i];
      if(nowMin>=it.sMin && nowMin<it.eMin){ current=it; currentIdx=i; }
      if(nowMin<it.sMin && !next){ next=it; }
    }
  }

  const nowCard = document.getElementById('nowCard');
  const countdownEl = document.getElementById('countdown');
  const countdownLabelEl = document.getElementById('countdownLabel');

  if(current){
    applyScene(current.scene);
    const totalSlotSec = Math.round((current.eMin - current.sMin)*60);
    let manualRemainSec = totalSlotSec;
    if (isManual) {
      let elapsedTotal = manualElapsedBeforePause;
      if (manualRunning && manualStartTs) {
        elapsedTotal += (Date.now() - manualStartTs)/1000;
      }
      manualRemainSec = Math.max(0, Math.round(totalSlotSec - elapsedTotal));
    }
    const manualAlert = isManual && (manualRunning || manualPaused) && manualRemainSec <= WARN_MIN*60;
    manualAlertGlobal = manualAlert;

    const remainMin = isManual ? (current.eMin - current.sMin) : (current.eMin - nowMin);
    const isAlert = isManual ? manualAlert : (remainMin <= WARN_MIN);

    document.getElementById('nowEyebrow').textContent = isManual
      ? (manualRunning ? (manualAlert ? '⚠ 곧 종료 · 수동 타이머' : '⏱ 진행 중 · 수동 타이머')
         : manualPaused ? '⏸ 일시정지됨'
         : '🖐 수동 모드 · 시작 대기')
      : (isAlert ? '곧 종료 · 시간을 확인하세요' : '진행 중');
    document.getElementById('nowTitle').textContent = current.title;
    document.getElementById('nowLeader').innerHTML = current.leader ? ('담당 · <b>'+current.leader+'</b>') : '&nbsp;';

    const descEl = document.getElementById('nowDesc');
    if(current.desc){ descEl.innerHTML = current.desc; descEl.classList.add('show'); }
    else { descEl.classList.remove('show'); }

    if(current.isClosing){ showClosingVideo(); } else { hideClosingVideo(); }
    if(current.isOpening){ showOpeningVideo(); } else { hideOpeningVideo(); }

    document.getElementById('rangePill').textContent = fmt12(current.s)+' – '+fmt12(current.e);

    if (isManual) {
      if (manualRunning || manualPaused) {
        const mm=Math.floor(manualRemainSec/60), ss=manualRemainSec%60;
        countdownEl.textContent = pad(mm)+':'+pad(ss);
        if (manualRemainSec <= 0) {
          countdownLabelEl.textContent = '⏰ 시간 종료!';
        } else {
          countdownLabelEl.textContent = manualPaused ? '⏸ 일시정지됨' : (manualAlert ? '⚠ 종료까지' : '종료까지 남은 시간');
        }
        if (manualRunning) {
          maybeTriggerZoom(manualRemainSec, 'm'+currentIdx, pad(mm)+':'+pad(ss));
        }
      } else {
        const totalMin = current.eMin - current.sMin;
        countdownEl.textContent = pad(Math.floor(totalMin))+':00';
        countdownLabelEl.textContent = '이 순서의 총 길이 · ⏱ 시작을 눌러주세요';
      }
    } else {
      const totalSec = Math.max(0, Math.round((current.eMin-nowMin)*60));
      const mm=Math.floor(totalSec/60), ss=totalSec%60;
      countdownEl.textContent = pad(mm)+':'+pad(ss);
      countdownLabelEl.textContent = isAlert ? '⚠ 종료까지' : '종료까지 남은 시간';
      maybeTriggerZoom(totalSec, 'a'+currentIdx, pad(mm)+':'+pad(ss));
    }
    nowCard.classList.toggle('alert', isAlert);
    document.getElementById('headerTimer').classList.toggle('alert', isAlert);
  } else {
    const before = nowMin < SCHEDULE[0].sMin;
    applyScene(before ? 'dawn' : 'sunset');
    nowCard.classList.remove('alert');
    document.getElementById('nowEyebrow').textContent = before ? '시작 전' : '💛 오늘 하루 감사했습니다';
    document.getElementById('nowTitle').textContent = before ? '행사 시작 전입니다' : '사랑하는 목자, 목녀님들 안녕히 돌아가세요~';
    document.getElementById('nowLeader').innerHTML = before
      ? ('첫 순서 · <b>'+SCHEDULE[0].title+'</b> ('+SCHEDULE[0].s+' 시작)')
      : '내년에 다시 만납시다~! 🎉';

    const descEl = document.getElementById('nowDesc');
    hideOpeningVideo();
    if(!before){
      descEl.innerHTML = '🍱 저녁 식사는 <b>시애틀우리교회</b>가 제공했습니다. 하나씩 받아 가셔도 좋고, 식사하고 가셔도 좋습니다.<br>기쁜 찬양과 함께 마무리해요 🎶 <b>그 날에 (One Day)</b>';
      descEl.classList.add('show');
      showClosingVideo();
    } else {
      descEl.classList.remove('show');
      hideClosingVideo();
    }

    document.getElementById('rangePill').textContent = before ? ('시작 '+fmt12(SCHEDULE[0].s)) : '종료';
    countdownEl.textContent = before ? '--:--' : '🙏';
    countdownLabelEl.textContent = before ? '시작까지 남은 시간' : '수고 많으셨습니다';
  }

  if(next){
    document.getElementById('nextTxt').innerHTML = '<b>'+next.title+'</b>'+(next.leader?' · '+next.leader:'');
    document.getElementById('nextTime').textContent = fmt12(next.s)+' – '+fmt12(next.e);
  } else {
    document.getElementById('nextTxt').textContent = '다음 순서 없음 (오늘 일정 종료)';
    document.getElementById('nextTime').textContent = '';
  }

  SCHEDULE.forEach((it,i)=>{
    const el = document.getElementById('rail-item-'+i);
    if(!el) return;
    el.classList.remove('active','done','alert');
    if(i===currentIdx){
      el.classList.add('active');
      if(isManual ? manualAlertGlobal : (current && (current.eMin-nowMin)<=WARN_MIN)) el.classList.add('alert');
    } else if(isManual ? (i<currentIdx) : (it.eMin<=nowMin)){
      el.classList.add('done');
    }
  });
}

// ===== 수동/자동 모드 상태 =====
let isManual = false;
let manualIndex = 0;
let manualRunning = false;
let manualPaused = false;
let manualStartTs = null; // Date.now() 타임스탬프 (마지막 시작/재개 시점)
let manualElapsedBeforePause = 0; // 일시정지 전까지 누적된 경과 시간(초)

function buildRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = SCHEDULE.map((it,i)=>(
    '<div class="item" id="rail-item-'+i+'">'+
      '<div class="t">'+fmt12(it.s)+'–'+fmt12(it.e)+'</div>'+
      '<div class="n">'+it.title+(it.leader?'<br><span style="opacity:.7;font-size:12px;">'+it.leader+'</span>':'')+'</div>'+
    '</div>'
  )).join('');
}

buildRail();

// ===== 자동/수동 모드 전환 =====
const modeBtn = document.getElementById('modeBtn');
const navRow = document.getElementById('navGroup');
const firstBtn = document.getElementById('firstBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const lastBtn = document.getElementById('lastBtn');
const manualLabel = document.getElementById('manualLabel');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resumeBtn = document.getElementById('resumeBtn');
const stopBtn = document.getElementById('stopBtn');

function updateManualLabel(){
  manualLabel.textContent = (manualIndex+1)+' / '+SCHEDULE.length;
}

function setBtnState(state){
  // state: 'idle' | 'running' | 'paused'
  startBtn.style.display  = state==='idle'    ? 'inline-block' : 'none';
  pauseBtn.style.display  = state==='running' ? 'inline-block' : 'none';
  resumeBtn.style.display = state==='paused'  ? 'inline-block' : 'none';
  stopBtn.style.display   = (state==='running' || state==='paused') ? 'inline-block' : 'none';
}

function resetManualTimer(){
  manualRunning = false;
  manualPaused = false;
  manualStartTs = null;
  manualElapsedBeforePause = 0;
  lastZoomKey = null;
  setBtnState('idle');
}

modeBtn.addEventListener('click', () => {
  isManual = !isManual;
  if (isManual) {
    // 현재 실제 시간 기준 순서에서 수동 모드 시작
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    manualIndex = 0;
    for(let i=0;i<SCHEDULE.length;i++){ if(nowMin>=SCHEDULE[i].sMin) manualIndex = i; }
    modeBtn.textContent = '🖐 MANUAL';
    navGroup.style.display = 'flex';
  } else {
    modeBtn.textContent = '🔴 AUTO';
    navGroup.style.display = 'none';
  }
  resetManualTimer();
  updateManualLabel();
  render();
});

firstBtn.addEventListener('click', () => {
  manualIndex = 0;
  resetManualTimer();
  updateManualLabel();
  render();
});
prevBtn.addEventListener('click', () => {
  manualIndex = Math.max(0, manualIndex-1);
  resetManualTimer();
  updateManualLabel();
  render();
});
nextBtn.addEventListener('click', () => {
  manualIndex = Math.min(SCHEDULE.length-1, manualIndex+1);
  resetManualTimer();
  updateManualLabel();
  render();
});
lastBtn.addEventListener('click', () => {
  manualIndex = SCHEDULE.length-1;
  resetManualTimer();
  updateManualLabel();
  render();
});

// ▶ 시작
startBtn.addEventListener('click', () => {
  manualRunning = true;
  manualPaused = false;
  manualElapsedBeforePause = 0;
  manualStartTs = Date.now();
  setBtnState('running');
  render();
});
// ⏸ 일시정지 — 지금까지 경과 시간을 누적해두고 멈춤
pauseBtn.addEventListener('click', () => {
  if (manualStartTs) {
    manualElapsedBeforePause += (Date.now() - manualStartTs)/1000;
  }
  manualRunning = false;
  manualPaused = true;
  manualStartTs = null;
  setBtnState('paused');
  render();
});
// ▶ 재개 — 누적된 경과 시간부터 다시 흐름
resumeBtn.addEventListener('click', () => {
  manualRunning = true;
  manualPaused = false;
  manualStartTs = Date.now();
  setBtnState('running');
  render();
});
// ⏹ 정지 — 완전 리셋
stopBtn.addEventListener('click', () => {
  resetManualTimer();
  render();
});

updateManualLabel();

// ===== 화면 확대/축소 =====
let zoomLevel = 100;
const zoomLabel = document.getElementById('zoomLabel');
function applyZoom(){
  document.body.style.zoom = (zoomLevel/100);
  zoomLabel.textContent = zoomLevel + '%';
}
document.getElementById('zoomInBtn').addEventListener('click', () => {
  zoomLevel = Math.min(200, zoomLevel+10); applyZoom();
});
document.getElementById('zoomOutBtn').addEventListener('click', () => {
  zoomLevel = Math.max(50, zoomLevel-10); applyZoom();
});
document.getElementById('zoomResetBtn').addEventListener('click', () => {
  zoomLevel = 100; applyZoom();
});
